# Example local configuration for k3s-context-tunnel-manager.
# The official default path is ~/.local/share/k3s-context-tunnel-manager/yaml/config/config.yaml
# or $XDG_DATA_HOME/k3s-context-tunnel-manager/yaml/config/config.yaml.

remote_k3s_config_path: /etc/rancher/k3s/k3s.yaml
ssh_key_path: ~/.ssh/id_ed25519
k3s_api_port: 6443
port_range_start: 16443
port_range_size: 10000

# Update this path to your inventory checkout.
inventory_path: /path/to/ansible/inventory
